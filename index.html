<body>

<!-- ============ PANTALLA DE LOGIN ============ -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logos">
      <img src="/assets/agroforce-logo.png" alt="AGROFORCE" class="login-logo-agro">
      <div class="login-plus">+</div>
      <img src="/assets/tampa-logo.png" alt="TAMPA" class="login-logo-tampa">
    </div>
    <h1>CONTROL DE STOCK</h1>
    <p class="login-subtitle">LÍNEA DE PASTURAS</p>

    <form id="login-form">
      <label>CONTRASEÑA DE ACCESO</label>
      <input type="password" id="login-password" required autocomplete="current-password">

      <label>ACTUANDO COMO (OPCIONAL)</label>
      <select id="login-responsible">
        <option value="">— SIN ESPECIFICAR —</option>
      </select>

      <button type="submit" class="btn btn-primary btn-block">INGRESAR</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>
</div>

<!-- ============ APP PRINCIPAL ============ -->
<div id="app-shell" class="app-shell hidden">
  <header class="app-header">
    <div class="header-left">
      <img src="/assets/agroforce-logo.png" class="header-logo">
      <span class="header-divider">+</span>
      <img src="/assets/tampa-logo.png" class="header-logo header-logo-tampa">
      <span class="header-title">CONTROL DE STOCK — LÍNEA DE PASTURAS</span>
    </div>
    <div class="header-right">
      <span id="acting-as-label"></span>
      <button id="btn-logout" class="btn btn-ghost">CERRAR SESIÓN</button>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <a href="#/dashboard" data-view="dashboard">DASHBOARD</a>
      <a href="#/stock" data-view="stock">STOCK GENERAL</a>
      <a href="#/depositos" data-view="depositos">DEPÓSITOS</a>
      <a href="#/productos" data-view="productos">PRODUCTOS</a>
      <a href="#/entradas" data-view="entradas">ENTRADAS</a>
      <a href="#/salidas" data-view="salidas">SALIDAS</a>
      <a href="#/transferencias" data-view="transferencias">TRANSFERENCIAS</a>
      <a href="#/inventario" data-view="inventario">INVENTARIO</a>
      <a href="#/movimientos" data-view="movimientos">MOVIMIENTOS</a>
      <a href="#/responsables" data-view="responsables">RESPONSABLES</a>
      <a href="#/destinos" data-view="destinos">DESTINOS</a>
      <a href="#/reportes" data-view="reportes">REPORTES</a>
      <a href="#/auditoria" data-view="auditoria">AUDITORÍA</a>
      <a href="#/configuracion" data-view="configuracion">CONFIGURACIÓN</a>
    </nav>

    <main class="main-content" id="main-content">
      <!-- las vistas se renderizan aca -->
    </main>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script src="/app.js"></script>
</body>
